name: PR size

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write PR description to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      # The script comes from the base branch: a PR cannot change the rule it is measured with (REV-07).
      - name: Load the size script from the base branch
        run: |
          git show "origin/${{ github.base_ref }}:scripts/check-pr-size.sh" > "$RUNNER_TEMP/check-pr-size.sh"
          chmod +x "$RUNNER_TEMP/check-pr-size.sh"

      - name: Check PR size (limit 400 lines, Constitution Principle X)
        run: |
          "$RUNNER_TEMP/check-pr-size.sh" "origin/${{ github.base_ref }}" --body-file "$RUNNER_TEMP/pr-body.md"
