name: PR size

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write PR description to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Check PR size (limit 400 lines, Constitution Principle X)
        run: scripts/check-pr-size.sh "origin/${{ github.base_ref }}" --body-file "$RUNNER_TEMP/pr-body.md"
