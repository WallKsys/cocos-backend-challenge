name: Claude review

# Automatic review of every pull request by Claude (TEC-34), against the constitution, the spec of the slice and
# its Gherkin scenarios. The review is advisory: merging is still decided by the repository owner.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the review still in progress (saves subscription usage).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read
  checks: read

jobs:
  review:
    # Skip drafts, and PRs from forks (secrets are not available to them on a public repository).
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Review only after the CI "verify" check of this commit has finished, so the reviewer sees its real result.
      # Waiting costs runner minutes only (no model usage). After 20 minutes it reviews anyway.
      - name: Wait for the CI verify check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 60); do
            status=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=verify" --jq '.check_runs[0].status // "missing"' || echo "error")
            conclusion=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=verify" --jq '.check_runs[0].conclusion // ""' || echo "")
            echo "verify: $status $conclusion"
            if [ "$status" = "completed" ]; then exit 0; fi
            sleep 20
          done
          echo "::warning::verify did not finish in 20 minutes; reviewing anyway"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the reviewer of pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}
            (base branch: ${{ github.event.pull_request.base.ref }}).
            Read the file .github/claude/pr-review.md and follow it exactly.
          claude_args: >-
            --allowedTools "Read,Write,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(scripts/check-pr-size.sh:*),Bash(cmp:*)"
