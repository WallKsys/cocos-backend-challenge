spring:
  application:
    name: cocos-broker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cocos}
    username: ${DB_USER:cocos}
    password: ${DB_PASSWORD:cocos}
  flyway:
    locations: classpath:db/migration
  web:
    locale: en
    locale-resolver: fixed
  jackson:
    deserialization:
      fail-on-unknown-properties: true      # DEC-24 (verified on Boot 4.1.3)

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  otlp:
    metrics:
      export:
        enabled: false
        step: 10s
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[cocos.account.lock.wait]": true

logging:
  structured:
    format:
      console: ecs

# Internal (admin/demo) endpoints are disabled by default (TEC-18). Spec 003 reads this property.
cocos:
  internal-tools:
    enabled: false

springdoc:
  swagger-ui:
    url: /openapi/openapi.yaml

---
spring:
  config:
    activate:
      on-profile: demo

cocos:
  internal-tools:
    enabled: true

management:
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTLP_BASE_URL:http://localhost:4318}/v1/metrics
  tracing:
    export:
      otlp:
        enabled: true
  logging:
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_BASE_URL:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_BASE_URL:http://localhost:4318}/v1/logs
