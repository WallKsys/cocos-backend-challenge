spring:
  application:
    name: cocos-broker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cocos}
    username: ${DB_USER:cocos}
    password: ${DB_PASSWORD:cocos}
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs

# Internal (admin/demo) endpoints are disabled by default (TEC-18). Spec 003 reads this property.
cocos:
  internal-tools:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: demo

cocos:
  internal-tools:
    enabled: true
