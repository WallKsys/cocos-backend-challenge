openapi: 3.1.0
info:
  title: Cocos Broker API
  version: 0.4.0
  description: |
    Broker API: portfolio, instrument search and orders (Cocos backend challenge).

    Conventions (RFC TEC-18 to TEC-20):
    - The requesting user is identified by the `X-User-Id` header (no authentication in the challenge scope).
    - Operations with effect require the `Idempotency-Key` header.
    - Amounts, prices and percentages are strings with exactly 2 decimals; share quantities are integers.
    - Timestamps are ISO 8601 in UTC (`2026-11-21T14:36:00Z`).
    - Errors use RFC 9457 Problem Details with a stable `code`. All texts are in English.
    - `/api/internal/**` endpoints are demo-only, disabled by default, and require `X-Role: ADMIN`.

    This file is cumulative: each spec publishes the full contract as of that spec.
servers:
  - url: http://localhost:8080

paths:
  /api/v1/instruments:
    get:
      operationId: searchInstruments
      summary: Search tradable instruments by ticker and/or name
      description: |
        Public market data: no `X-User-Id` required. Cash (ARS) is never returned (DEC-08).
        - `q` matches ticker **or** name; `ticker` matches the ticker; `name` matches the name. All given criteria must match.
        - Matching ignores case and accents. With 3 or more characters it is partial ("contains").
          With 1 or 2 characters, `q` and `ticker` only match an exact ticker (DEC-21); `name` is rejected
          with `SEARCH_TERM_TOO_SHORT`.
        - Order: exact ticker match of `q`, then tickers starting with `q`, then other matches; alphabetical by
          ticker within each group. Without `q`: alphabetical by ticker.
        - No criteria: the whole market, paginated (DEC-19). No matches: empty list, not an error.
      parameters:
        - name: q
          in: query
          required: false
          description: General term (ticker or name). Trimmed; blank means absent. Max 100 characters.
          schema: { type: string, maxLength: 100 }
          example: banco
        - name: ticker
          in: query
          required: false
          description: Ticker filter. Trimmed; blank means absent. Max 100 characters.
          schema: { type: string, maxLength: 100 }
        - name: name
          in: query
          required: false
          description: Name filter. Trimmed; blank means absent. At least 3 characters, max 100.
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from `nextCursor` of the previous page. Only valid with the same criteria.
          schema: { type: string }
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A page of instruments.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentPage'
              example:
                items:
                  - id: 47
                    ticker: PAMP
                    name: Pampa Holding S.A.
                    type: ACCIONES
                    lastPrice: '925.85'
                    dailyChangePct: '0.44'
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: Id of the requesting user. Positive integer.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    RoleHeader:
      name: X-Role
      in: header
      required: true
      description: Must be `ADMIN` for internal endpoints.
      schema:
        type: string
        enum: [ADMIN]
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated key, unique per user across all operations (DEC-23). 1 to 255 visible ASCII characters.
        Resending the same request with the same key returns the original result.
      schema:
        type: string
        pattern: '^[\x21-\x7E]{1,255}$'
      example: 3f2b8c1e-9a4d-4f7e-b6a2-1c0d5e8f9a7b
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation id. Generated by the server when absent or invalid; always echoed in the response.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'

  headers:
    RequestId:
      description: Correlation id of the request.
      schema:
        type: string
    IdempotentReplayed:
      description: Present with value `true` when the response is the original result of an already processed request.
      schema:
        type: string
        enum: ['true']

  schemas:
    Money:
      type: string
      description: Decimal amount in ARS with exactly 2 decimals.
      pattern: '^-?\d{1,16}\.\d{2}$'
      example: '925.85'
    Percentage:
      type: string
      description: Percentage with exactly 2 decimals.
      pattern: '^-?\d{1,16}\.\d{2}$'
      example: '-0.45'
    Timestamp:
      type: string
      format: date-time
      description: UTC instant, ISO 8601 with `Z`.
      example: '2026-11-21T14:36:00Z'
    OrderSide:
      type: string
      enum: [BUY, SELL, CASH_IN, CASH_OUT]
    OrderType:
      type: string
      enum: [MARKET, LIMIT]
    OrderStatus:
      type: string
      enum: [NEW, FILLED, REJECTED, CANCELLED]
    RejectionReason:
      type: string
      enum: [INSUFFICIENT_FUNDS, INSUFFICIENT_SHARES, AMOUNT_BELOW_PRICE, NO_MARKET_PRICE]
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - MISSING_IDEMPOTENCY_KEY
        - SEARCH_TERM_TOO_SHORT
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - NOT_ACCEPTABLE
        - ORDER_NOT_CANCELLABLE
        - UNSUPPORTED_MEDIA_TYPE
        - IDEMPOTENCY_CONFLICT
        - REQUEST_ERROR
        - INTERNAL_ERROR
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: price
        message:
          type: string
          example: is required for LIMIT orders
    Problem:
      type: object
      description: RFC 9457 Problem Details. Media type `application/problem+json`.
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri
          example: https://api.cocos.example/errors/validation-error
        title:
          type: string
          example: Validation error
        status:
          type: integer
          example: 400
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          example: "Request validation failed: 'price' is required for LIMIT orders."
        instance:
          type: string
          example: /api/v1/orders
        errors:
          type: array
          description: Present only for VALIDATION_ERROR caused by request fields.
          items:
            $ref: '#/components/schemas/FieldError'
    InstrumentType:
      type: string
      enum: [ACCIONES, MONEDA]
    InstrumentSummary:
      type: object
      required: [id, ticker, name, type, lastPrice, dailyChangePct]
      properties:
        id:
          type: integer
          example: 47
        ticker:
          type: string
          example: PAMP
        name:
          type: string
          example: Pampa Holding S.A.
        type:
          $ref: '#/components/schemas/InstrumentType'
        lastPrice:
          description: Latest close. Null when the instrument has no market data.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        dailyChangePct:
          description: (close - previousClose) / previousClose x 100, 2 decimals HALF_UP. Null without market data or previous close.
          oneOf:
            - $ref: '#/components/schemas/Percentage'
            - type: 'null'
    InstrumentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentSummary'
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page; null on the last page.
    CursorPage:
      type: object
      description: Base shape of cursor-paginated responses (items are defined by each endpoint).
      required: [items]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; null on the last page.

  responses:
    BadRequest:
      description: Invalid request (VALIDATION_ERROR, MISSING_IDEMPOTENCY_KEY, SEARCH_TERM_TOO_SHORT). Nothing was stored.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found, or it belongs to another user (indistinguishable on purpose).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource state does not allow the operation (ORDER_NOT_CANCELLABLE).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The idempotency key was already used for a different request (IDEMPOTENCY_CONFLICT).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected error (INTERNAL_ERROR). No internal detail is exposed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
